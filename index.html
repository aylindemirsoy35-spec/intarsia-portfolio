
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahşap İntarsiya Portfolyo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1e1e1e; color: #f5f0ea; padding: 20px; }
        header { text-align: center; padding: 40px 0; }
        header h1 { color: #dfb15b; font-size: 2.6rem; margin-bottom: 10px; }
        header p { color: #a09085; font-size: 1.1rem; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 20px 0; }
        .card { background: #2a2a2a; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid #333; }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-title { font-size: 1.2rem; color: #f5f0ea; margin-bottom: 10px; font-weight: bold; }
        .card-price { font-size: 1.4rem; color: #dfb15b; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Ahşap İntarsiya Koleksiyonu</h1>
        <p>Aracısız, El Emeği Özel Tasarım Sanat Eserleri</p>
    </header>
    <div class="container">
        <!-- 14 Ürünlük galeri içeriği ve güncellenmiş görsel bağlantıları bu kod bloğunda yer almaktadır. -->
    </div>
</body>
</html>
