<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Sayfası</title>
    <style>
        /* Dün hazırladığımız temel ürün kartı stilleri */
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .product-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; width: 250px; text-align: center; }
        /* Resimlerin taşmaması ve düzgün yüklenmesi için alan */
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; background-color: #eee; }
        .price { color: #2ecc71; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Ürünlerimiz</h1>

    <div class="product-container">
        <!-- 1. Ürün Kartı -->
        <div class="product-card">
            <!-- GitHub Pages için göreceli (relative) dosya yolu kullandık -->
            <img src="images/urun1.jpg" alt="Ürün 1">
            <h3>Akıllı Saat</h3>
            <p class="price">2.499 TL</p>
        </div>

        <!-- 2. Ürün Kartı -->
        <div class="product-card">
            <img src="images/urun2.jpg" alt="Ürün 2">
            <h3>Kablosuz Kulaklık</h3>
            <p class="price">1.899 TL</p>
        </div>
    </div>

</body>
</html>
